<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="GitHub signal metrics and most used languages">
<title>GitHub signal metrics and most used languages</title>
<style>
    #signal .beam-rect {
      animation: beam-sweep-signal 9s 0.6s infinite linear;
    }
    @keyframes beam-sweep-signal {
      from { transform: translateX(-220px); }
      to   { transform: translateX(1000px); }
    }
    #signal .fade-in {
      opacity: 0;
      animation: fadein-signal 0.8s 0.8s ease-out forwards;
    }
    @keyframes fadein-signal {
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #signal * {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      #signal animate, #signal animateTransform {
        fill: freeze;
        begin: 0s;
        dur: 0.001s;
        repeatCount: 1;
      }
    }
  </style>
<defs>
  <linearGradient id="signal-edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2C6E9E" stop-opacity="0.85"/>
    <stop offset="0.5" stop-color="#4FC3F7" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#2C6E9E" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="signal-beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A8E4FF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#A8E4FF" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#A8E4FF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="signal-halo" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#4FC3F7" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/>
  </radialGradient>
  <pattern id="signal-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#14213D" stroke-width="1"/>
  </pattern>
  <filter id="signal-glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="signal-clip"><rect x="1" y="1" width="998" height="338" rx="14"/></clipPath>
</defs>
<g id="signal" clip-path="url(#signal-clip)">
  <rect width="1000" height="340" fill="#0A1128"/>
  <rect width="1000" height="340" fill="url(#signal-grid)" opacity="0.45"/>
  <ellipse cx="140" cy="0" rx="360" ry="200" fill="url(#signal-halo)"/>
  <rect x="-220" y="0" width="220" height="340" fill="url(#signal-beam)">
    <animate attributeName="x" values="-220;1000" dur="9s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">
    <rect x="60" y="44" width="34" height="2" fill="#4FC3F7"/>
    <text x="60" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" letter-spacing="3.2" fill="#9DB4CE">GITHUB SIGNAL // REAL-TIME METRICS</text>
    <text x="60" y="96" font-size="11.5" fill="#5F7796">live telemetries · auto-refreshed daily via GitHub Actions</text>
    <g><rect x="60" y="126" width="140" height="68" rx="8" fill="#0E1830" stroke="#14213D" stroke-width="1"/><text x="76" y="160" font-size="26" font-weight="700" fill="#4FC3F7">615</text><text x="76" y="179" font-size="9.5" fill="#5F7796">contributions / year</text></g>
    <g><rect x="214" y="126" width="140" height="68" rx="8" fill="#0E1830" stroke="#14213D" stroke-width="1"/><text x="230" y="160" font-size="26" font-weight="700" fill="#4FC3F7">27</text><text x="230" y="179" font-size="9.5" fill="#5F7796">public repositories</text></g>
    <g><rect x="368" y="126" width="140" height="68" rx="8" fill="#0E1830" stroke="#14213D" stroke-width="1"/><text x="384" y="160" font-size="26" font-weight="700" fill="#4FC3F7">5</text><text x="384" y="179" font-size="9.5" fill="#5F7796">stars earned</text></g>
    <g><rect x="60" y="210" width="140" height="68" rx="8" fill="#0E1830" stroke="#14213D" stroke-width="1"/><text x="76" y="244" font-size="26" font-weight="700" fill="#4FC3F7">2</text><text x="76" y="263" font-size="9.5" fill="#5F7796">followers</text></g>
    <g><rect x="214" y="210" width="140" height="68" rx="8" fill="#0E1830" stroke="#14213D" stroke-width="1"/><text x="230" y="244" font-size="26" font-weight="700" fill="#4FC3F7">19</text><text x="230" y="263" font-size="9.5" fill="#5F7796">current streak (days)</text></g>
    <g><rect x="368" y="210" width="140" height="68" rx="8" fill="#0E1830" stroke="#14213D" stroke-width="1"/><text x="384" y="244" font-size="26" font-weight="700" fill="#4FC3F7">19</text><text x="384" y="263" font-size="9.5" fill="#5F7796">longest streak (days)</text></g>
    <line x1="550" y1="112" x2="550" y2="306" stroke="#14213D" stroke-width="1"/>
    <text x="590" y="132" font-size="12" letter-spacing="2.5" fill="#9DB4CE">MOST USED LANGUAGES</text>
    <text x="590" y="152" font-size="10.5" fill="#5F7796">by bytes across 27 public repositories</text>
    <text x="590" y="188" font-size="12" fill="#9DB4CE">Java</text>
    <rect x="720" y="180" width="180" height="8" rx="4" fill="#14213D"/>
    <rect x="720" y="180" width="0" height="8" rx="4" fill="#b07219"><animate attributeName="width" values="0;106" dur="1s" begin="0.50s" fill="freeze"/></rect>
    <text x="914" y="188" font-size="10.5" fill="#5F7796">59.0%</text>
    <text x="590" y="214" font-size="12" fill="#9DB4CE">JavaScript</text>
    <rect x="720" y="206" width="180" height="8" rx="4" fill="#14213D"/>
    <rect x="720" y="206" width="0" height="8" rx="4" fill="#f1e05a"><animate attributeName="width" values="0;36" dur="1s" begin="0.60s" fill="freeze"/></rect>
    <text x="914" y="214" font-size="10.5" fill="#5F7796">20.2%</text>
    <text x="590" y="240" font-size="12" fill="#9DB4CE">HTML</text>
    <rect x="720" y="232" width="180" height="8" rx="4" fill="#14213D"/>
    <rect x="720" y="232" width="0" height="8" rx="4" fill="#e34c26"><animate attributeName="width" values="0;30" dur="1s" begin="0.70s" fill="freeze"/></rect>
    <text x="914" y="240" font-size="10.5" fill="#5F7796">16.7%</text>
    <text x="590" y="266" font-size="12" fill="#9DB4CE">Python</text>
    <rect x="720" y="258" width="180" height="8" rx="4" fill="#14213D"/>
    <rect x="720" y="258" width="0" height="8" rx="4" fill="#3572A5"><animate attributeName="width" values="0;6" dur="1s" begin="0.80s" fill="freeze"/></rect>
    <text x="914" y="266" font-size="10.5" fill="#5F7796">2.8%</text>
    <text x="590" y="292" font-size="12" fill="#9DB4CE">CSS</text>
    <rect x="720" y="284" width="180" height="8" rx="4" fill="#14213D"/>
    <rect x="720" y="284" width="0" height="8" rx="4" fill="#563d7c"><animate attributeName="width" values="0;6" dur="1s" begin="0.90s" fill="freeze"/></rect>
    <text x="914" y="292" font-size="10.5" fill="#5F7796">1.3%</text>
  </g>
</g>
<rect x="1" y="1" width="998" height="338" rx="14" fill="none" stroke="url(#signal-edge)" stroke-width="1.4"/>
</svg>
