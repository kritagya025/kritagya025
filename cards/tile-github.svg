<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100" role="img" aria-label="GITHUB: @kritagya025  ·  27 repos">
<title>GITHUB: @kritagya025  ·  27 repos</title>
<style>
    #tile-github .beam-rect {
      animation: beam-sweep-tile-github 9s 0.3s infinite linear;
    }
    @keyframes beam-sweep-tile-github {
      from { transform: translateX(-220px); }
      to   { transform: translateX(320px); }
    }
    #tile-github .fade-in {
      opacity: 0;
      animation: fadein-tile-github 0.8s 0.6s ease-out forwards;
    }
    @keyframes fadein-tile-github {
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #tile-github * {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      #tile-github animate, #tile-github animateTransform {
        fill: freeze;
        begin: 0s;
        dur: 0.001s;
        repeatCount: 1;
      }
    }
  </style>
<defs>
  <linearGradient id="tile-github-edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2C6E9E" stop-opacity="0.85"/>
    <stop offset="0.5" stop-color="#4FC3F7" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#2C6E9E" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="tile-github-beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A8E4FF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#A8E4FF" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#A8E4FF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="tile-github-halo" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#4FC3F7" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/>
  </radialGradient>
  <pattern id="tile-github-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#14213D" stroke-width="1"/>
  </pattern>
  <filter id="tile-github-glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="tile-github-clip"><rect x="1" y="1" width="318" height="98" rx="14"/></clipPath>
</defs>
<g id="tile-github" clip-path="url(#tile-github-clip)">
  <rect width="320" height="100" fill="#0A1128"/>
  <rect width="320" height="100" fill="url(#tile-github-grid)" opacity="0.45"/>
  <ellipse cx="140" cy="0" rx="360" ry="200" fill="url(#tile-github-halo)"/>
  <rect x="-220" y="0" width="220" height="100" fill="url(#tile-github-beam)">
    <animate attributeName="x" values="-220;320" dur="9s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">

    <g transform="translate(24, 28) scale(1.1)">
      <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2z" fill="#E8F1FA"/>
    </g>
    <text x="70" y="44" font-size="16" font-weight="700" fill="#E8F1FA">GITHUB</text>
    <text x="70" y="66" font-size="11" fill="#5F7796">@kritagya025  ·  27 repos</text>
    <rect x="236" y="34" width="62" height="24" rx="12" fill="#0E1830" stroke="#1B3A6B" stroke-width="1"/>
    <text x="267" y="50" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4FC3F7">Follow</text>
    
  </g>
</g>
<rect x="1" y="1" width="318" height="98" rx="14" fill="none" stroke="url(#tile-github-edge)" stroke-width="1.4"/>
</svg>
