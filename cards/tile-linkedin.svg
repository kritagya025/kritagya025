<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100" role="img" aria-label="LINKEDIN: in/kritagya-yadav">
<title>LINKEDIN: in/kritagya-yadav</title>
<style>
    #tile-linkedin .beam-rect {
      animation: beam-sweep-tile-linkedin 9s 0.2s infinite linear;
    }
    @keyframes beam-sweep-tile-linkedin {
      from { transform: translateX(-220px); }
      to   { transform: translateX(320px); }
    }
    #tile-linkedin .fade-in {
      opacity: 0;
      animation: fadein-tile-linkedin 0.8s 0.4s ease-out forwards;
    }
    @keyframes fadein-tile-linkedin {
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #tile-linkedin * {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      #tile-linkedin animate, #tile-linkedin animateTransform {
        fill: freeze;
        begin: 0s;
        dur: 0.001s;
        repeatCount: 1;
      }
    }
  </style>
<defs>
  <linearGradient id="tile-linkedin-edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2C6E9E" stop-opacity="0.85"/>
    <stop offset="0.5" stop-color="#4FC3F7" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#2C6E9E" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="tile-linkedin-beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A8E4FF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#A8E4FF" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#A8E4FF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="tile-linkedin-halo" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#4FC3F7" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/>
  </radialGradient>
  <pattern id="tile-linkedin-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#14213D" stroke-width="1"/>
  </pattern>
  <filter id="tile-linkedin-glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="tile-linkedin-clip"><rect x="1" y="1" width="318" height="98" rx="14"/></clipPath>
</defs>
<g id="tile-linkedin" clip-path="url(#tile-linkedin-clip)">
  <rect width="320" height="100" fill="#0A1128"/>
  <rect width="320" height="100" fill="url(#tile-linkedin-grid)" opacity="0.45"/>
  <ellipse cx="140" cy="0" rx="360" ry="200" fill="url(#tile-linkedin-halo)"/>
  <rect x="-220" y="0" width="220" height="100" fill="url(#tile-linkedin-beam)">
    <animate attributeName="x" values="-220;320" dur="9s" begin="0.2s" repeatCount="indefinite"/>
  </rect>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">

    <g transform="translate(24, 28) scale(1.1)">
      <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z" fill="#0A66C2"/>
    </g>
    <text x="70" y="44" font-size="16" font-weight="700" fill="#E8F1FA">LINKEDIN</text>
    <text x="70" y="66" font-size="11" fill="#5F7796">in/kritagya-yadav</text>
    <rect x="236" y="34" width="62" height="24" rx="12" fill="#0E1830" stroke="#1B3A6B" stroke-width="1"/>
    <text x="267" y="50" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4FC3F7">Connect</text>
    
  </g>
</g>
<rect x="1" y="1" width="318" height="98" rx="14" fill="none" stroke="url(#tile-linkedin-edge)" stroke-width="1.4"/>
</svg>
