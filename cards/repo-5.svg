<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="1000" height="140" role="img" aria-label="Repository: disaster-coordination-system">

<title>Repository: disaster-coordination-system</title>

<style>

    #repo-5 .beam-rect {

      animation: beam-sweep-repo-5 9s 2.5s infinite linear;

    }

    @keyframes beam-sweep-repo-5 {

      from { transform: translateX(-220px); }

      to   { transform: translateX(1000px); }

    }

    #repo-5 .fade-in {

      opacity: 0;

      animation: fadein-repo-5 0.8s 2.7s ease-out forwards;

    }

    @keyframes fadein-repo-5 {

      to { opacity: 1; }

    }

    #repo-5 .slide-up {

      opacity: 0;

      transform: translateY(12px);

      animation: slideup-repo-5 0.6s ease-out forwards;

    }

    @keyframes slideup-repo-5 {

      to { opacity: 1; transform: translateY(0); }

    }

    

    

    @media (prefers-reduced-motion: reduce) {

      #repo-5 * {

        animation-play-state: paused !important;

        animation-delay: -1s !important;

        animation-duration: 0s !important;

        animation-iteration-count: 1 !important;

      }

      #repo-5 animate,

      #repo-5 animateTransform {

        fill: freeze;

        begin: 0s;

        dur: 0.001s;

        repeatCount: 1;

      }

    }

  </style>

<defs>

  <linearGradient id="repo-5-edge" x1="0" y1="0" x2="1" y2="1">

    <stop offset="0" stop-color="#2C6E9E" stop-opacity="0.85"/>

    <stop offset="0.5" stop-color="#4FC3F7" stop-opacity="0.85"/>

    <stop offset="1" stop-color="#2C6E9E" stop-opacity="0.85"/>

  </linearGradient>

  <linearGradient id="repo-5-beam" x1="0" y1="0" x2="1" y2="0">

    <stop offset="0" stop-color="#A8E4FF" stop-opacity="0"/>

    <stop offset="0.5" stop-color="#A8E4FF" stop-opacity="0.13"/>

    <stop offset="1" stop-color="#A8E4FF" stop-opacity="0"/>

  </linearGradient>

  <radialGradient id="repo-5-halo" cx="50%" cy="50%" r="50%">

    <stop offset="0" stop-color="#4FC3F7" stop-opacity="0.18"/>

    <stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/>

  </radialGradient>

  <pattern id="repo-5-grid" width="40" height="40" patternUnits="userSpaceOnUse">

    <path d="M40 0H0V40" fill="none" stroke="#14213D" stroke-width="1"/>

  </pattern>

  <filter id="repo-5-glow" x="-60%" y="-60%" width="220%" height="220%">

    <feGaussianBlur stdDeviation="2.2" result="b"/>

    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>

  </filter>

  <clipPath id="repo-5-clip"><rect x="1" y="1" width="998" height="138" rx="16"/></clipPath>

</defs>

<g id="repo-5" clip-path="url(#repo-5-clip)">

  <rect width="1000" height="140" fill="#0A1128"/>

  <rect width="1000" height="140" fill="url(#repo-5-grid)" opacity="0.5"/>

  <ellipse cx="150" cy="0" rx="380" ry="210" fill="url(#repo-5-halo)"/>

  <rect x="-220" y="0" width="220" height="140" fill="url(#repo-5-beam)">

    <animate attributeName="x" values="-220;1000" dur="9s" begin="2.5s" repeatCount="indefinite"/>

  </rect>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">
    <a href="https://github.com/kritagya025/disaster-coordination-system" target="_blank"><text x="64" y="48" font-size="18" font-weight="700" fill="#4FC3F7" text-decoration="none">disaster-coordination-system</text></a>
    <text x="64" y="76" font-size="13" fill="#9DB4CE">No description</text>
    <circle cx="76" cy="104" r="5" fill="#563d7c"/>    <text x="90" y="108" font-size="12" fill="#5F7796">CSS</text>
    <text x="220" y="108" font-size="12" fill="#5F7796">★ 1</text>
    <text x="280" y="108" font-size="12" fill="#5F7796">⑂ 0</text>
  <g transform="translate(900,30) scale(0.8)" opacity="0.2">

    <path d="M20 2 L37 28 L15 33 Z" fill="#2C6E9E" opacity="0.75"/>

    <path d="M80 2 L63 28 L85 33 Z" fill="#2C6E9E" opacity="0.75"/>

    <path d="M15 29 L50 17 L85 29 L77 58 L50 97 L23 58 Z" fill="#0E1830" stroke="#1B3A6B" stroke-width="1.6"/>

    <path d="M50 17 L85 29 L77 58 L50 97 Z" fill="#05070D" opacity="0.4"/>

    <path d="M50 30 L54 52 L50 60 L46 52 Z" fill="#1B3A6B" opacity="0.9"/>

    <path d="M42 66 L50 78 L58 66 L50 71 Z" fill="#1B3A6B"/>

    <g filter="url(#repo-5-glow)">

      <path d="M29 45 L43 41 L44 47 L30 50 Z" fill="#4FC3F7"/>

      <path d="M71 45 L57 41 L56 47 L70 50 Z" fill="#4FC3F7"/>

    </g>

  </g>
  </g>

</g>

<rect x="1" y="1" width="998" height="138" rx="16" fill="none" stroke="url(#repo-5-edge)" stroke-width="1.4"/>

</svg>

