<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Monthly contribution activity pulse chart">
<title>Monthly contribution activity pulse chart</title>
<style>
    #chart .beam-rect {
      animation: beam-sweep-chart 9s 0.8s infinite linear;
    }
    @keyframes beam-sweep-chart {
      from { transform: translateX(-220px); }
      to   { transform: translateX(1000px); }
    }
    #chart .fade-in {
      opacity: 0;
      animation: fadein-chart 0.8s 1.0s ease-out forwards;
    }
    @keyframes fadein-chart {
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #chart * {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      #chart animate, #chart animateTransform {
        fill: freeze;
        begin: 0s;
        dur: 0.001s;
        repeatCount: 1;
      }
    }
  </style>
<defs>
  <linearGradient id="chart-edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2C6E9E" stop-opacity="0.85"/>
    <stop offset="0.5" stop-color="#4FC3F7" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#2C6E9E" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="chart-beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A8E4FF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#A8E4FF" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#A8E4FF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="chart-halo" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#4FC3F7" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/>
  </radialGradient>
  <pattern id="chart-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#14213D" stroke-width="1"/>
  </pattern>
  <filter id="chart-glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="chart-clip"><rect x="1" y="1" width="998" height="318" rx="14"/></clipPath>
</defs>
<g id="chart" clip-path="url(#chart-clip)">
  <rect width="1000" height="320" fill="#0A1128"/>
  <rect width="1000" height="320" fill="url(#chart-grid)" opacity="0.45"/>
  <ellipse cx="140" cy="0" rx="360" ry="200" fill="url(#chart-halo)"/>
  <rect x="-220" y="0" width="220" height="320" fill="url(#chart-beam)">
    <animate attributeName="x" values="-220;1000" dur="9s" begin="0.8s" repeatCount="indefinite"/>
  </rect>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">
    <rect x="60" y="44" width="34" height="2" fill="#4FC3F7"/>
    <text x="60" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" letter-spacing="3.2" fill="#9DB4CE">CONTRIBUTION PULSE // LAST 12 MONTHS</text>
    <text x="730" y="96" font-size="19" font-weight="700" fill="#4FC3F7">615</text>    <text x="730" y="111" font-size="9.5" fill="#5F7796">total contributions</text>
    <text x="730" y="138" font-size="19" font-weight="700" fill="#4FC3F7">19 days</text>    <text x="730" y="153" font-size="9.5" fill="#5F7796">current streak</text>
    <text x="730" y="180" font-size="19" font-weight="700" fill="#4FC3F7">19 days</text>    <text x="730" y="195" font-size="9.5" fill="#5F7796">longest streak</text>
    <text x="730" y="222" font-size="19" font-weight="700" fill="#4FC3F7">121 days</text>    <text x="730" y="237" font-size="9.5" fill="#5F7796">active commit days</text>
    <text x="730" y="264" font-size="19" font-weight="700" fill="#4FC3F7">23 commits</text>    <text x="730" y="279" font-size="9.5" fill="#5F7796">peak day · 2026-08-27</text>
    <line x1="695" y1="84" x2="695" y2="286" stroke="#14213D" stroke-width="1"/>
    <rect x="60.0" y="110" width="42.7" height="140" rx="4" fill="#0E1830"/>
    <rect x="60.0" y="250" width="42.7" height="0" rx="4" fill="#2C6E9E"><animate attributeName="height" values="0;6" dur="0.8s" begin="0.80s" fill="freeze"/><animate attributeName="y" values="250;244" dur="0.8s" begin="0.80s" fill="freeze"/></rect>
    <text x="81.3" y="268" text-anchor="middle" font-size="9.5" fill="#5F7796">Dec</text>
