<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Monthly contribution chart with streak and activity stats">

<title>Monthly contribution chart with streak and activity stats</title>

<style>

    #chart .beam-rect {

      animation: beam-sweep-chart 9s 1.0s infinite linear;

    }

    @keyframes beam-sweep-chart {

      from { transform: translateX(-220px); }

      to   { transform: translateX(1000px); }

    }

    #chart .fade-in {

      opacity: 0;

      animation: fadein-chart 0.8s 1.2s ease-out forwards;

    }

    @keyframes fadein-chart {

      to { opacity: 1; }

    }

    #chart .slide-up {

      opacity: 0;

      transform: translateY(12px);

      animation: slideup-chart 0.6s ease-out forwards;

    }

    @keyframes slideup-chart {

      to { opacity: 1; transform: translateY(0); }

    }

    

    

    @media (prefers-reduced-motion: reduce) {

      #chart * {

        animation-play-state: paused !important;

        animation-delay: -1s !important;

        animation-duration: 0s !important;

        animation-iteration-count: 1 !important;

      }

      #chart animate,

      #chart animateTransform {

        fill: freeze;

        begin: 0s;

        dur: 0.001s;

        repeatCount: 1;

      }

    }

  </style>

<defs>

  <linearGradient id="chart-edge" x1="0" y1="0" x2="1" y2="1">

    <stop offset="0" stop-color="#2C6E9E" stop-opacity="0.85"/>

    <stop offset="0.5" stop-color="#4FC3F7" stop-opacity="0.85"/>

    <stop offset="1" stop-color="#2C6E9E" stop-opacity="0.85"/>

  </linearGradient>

  <linearGradient id="chart-beam" x1="0" y1="0" x2="1" y2="0">

    <stop offset="0" stop-color="#A8E4FF" stop-opacity="0"/>

    <stop offset="0.5" stop-color="#A8E4FF" stop-opacity="0.13"/>

    <stop offset="1" stop-color="#A8E4FF" stop-opacity="0"/>

  </linearGradient>

  <radialGradient id="chart-halo" cx="50%" cy="50%" r="50%">

    <stop offset="0" stop-color="#4FC3F7" stop-opacity="0.18"/>

    <stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/>

  </radialGradient>

  <pattern id="chart-grid" width="40" height="40" patternUnits="userSpaceOnUse">

    <path d="M40 0H0V40" fill="none" stroke="#14213D" stroke-width="1"/>

  </pattern>

  <filter id="chart-glow" x="-60%" y="-60%" width="220%" height="220%">

    <feGaussianBlur stdDeviation="2.2" result="b"/>

    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>

  </filter>

  <clipPath id="chart-clip"><rect x="1" y="1" width="998" height="318" rx="16"/></clipPath>

</defs>

<g id="chart" clip-path="url(#chart-clip)">

  <rect width="1000" height="320" fill="#0A1128"/>

  <rect width="1000" height="320" fill="url(#chart-grid)" opacity="0.5"/>

  <ellipse cx="150" cy="0" rx="380" ry="210" fill="url(#chart-halo)"/>

  <rect x="-220" y="0" width="220" height="320" fill="url(#chart-beam)">

    <animate attributeName="x" values="-220;1000" dur="9s" begin="1.0s" repeatCount="indefinite"/>

  </rect>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">
    <rect x="64" y="44" width="34" height="2" fill="#4FC3F7"/>
    <text x="64" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" letter-spacing="3.2" fill="#9DB4CE">CONTRIBUTION PULSE</text>
    <text x="700" y="90" font-size="22" font-weight="700" fill="#4FC3F7">611</text>
    <text x="700" y="108" font-size="10" letter-spacing="0.6" fill="#5F7796">total contributions</text>
    <text x="700" y="140" font-size="22" font-weight="700" fill="#4FC3F7">19</text>
    <text x="700" y="158" font-size="10" letter-spacing="0.6" fill="#5F7796">current streak</text>
    <text x="700" y="190" font-size="22" font-weight="700" fill="#4FC3F7">19</text>
    <text x="700" y="208" font-size="10" letter-spacing="0.6" fill="#5F7796">longest streak</text>
    <text x="700" y="240" font-size="22" font-weight="700" fill="#4FC3F7">121</text>
    <text x="700" y="258" font-size="10" letter-spacing="0.6" fill="#5F7796">active days</text>
    <text x="700" y="290" font-size="22" font-weight="700" fill="#4FC3F7">23</text>
    <text x="700" y="308" font-size="10" letter-spacing="0.6" fill="#5F7796">busiest · Aug 27</text>
    <line x1="672" y1="80" x2="672" y2="310" stroke="#14213D" stroke-width="1"/>
    <rect x="64.0" y="110" width="42.8" height="160" rx="4" fill="#0E1830"/>
    <rect x="64.0" y="270" width="42.8" height="0" rx="4" fill="#2C6E9E"><animate attributeName="height" values="0;4" dur="0.8s" begin="1.30s" fill="freeze"/><animate attributeName="y" values="270;266" dur="0.8s" begin="1.30s" fill="freeze"/></rect>
    <text x="85.4" y="290" text-anchor="middle" font-size="9.5" fill="#5F7796">Dec</text>
    <rect x="112.8" y="110" width="42.8" height="160" rx="4" fill="#0E1830"/>
    <rect x="112.8" y="270" width="42.8" height="0" rx="4" fill="#2C6E9E"><animate attributeName="height" values="0;4" dur="0.8s" begin="1.36s" fill="freeze"/><animate attributeName="y" values="270;266" dur="0.8s" begin="1.36s" fill="freeze"/></rect>
    <text x="134.2" y="290" text-anchor="middle" font-size="9.5" fill="#5F7796">Jan</text>
    <text x="134.2" y="260" text-anchor="middle" font-size="9" fill="#9DB4CE" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.86s" fill="freeze"/>1</text>
    <rect x="161.7" y="110" width="42.8" height="160" rx="4" fill="#0E1830"/>
    <rect x="161.7" y="270" width="42.8" height="0" rx="4" fill="#2C6E9E"><animate attributeName="height" values="0;12" dur="0.8s" begin="1.42s" fill="freeze"/><animate attributeName="y" values="270;258" dur="0.8s" begin="1.42s" fill="freeze"/></rect>
    <text x="183.1" y="290" text-anchor="middle" font-size="9.5" fill="#5F7796">Feb</text>
    <text x="183.1" y="252" text-anchor="middle" font-size="9" fill="#9DB4CE" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.92s" fill="freeze"/>10</text>
    <rect x="210.5" y="110" width="42.8" height="160" rx="4" fill="#0E1830"/>
    <rect x="210.5" y="270" width="42.8" height="0" rx="4" fill="#2C6E9E"><animate attributeName="height" values="0;83" dur="0.8s" begin="1.48s" fill="freeze"/><animate attributeName="y" values="270;187" dur="0.8s" begin="1.48s" fill="freeze"/></rect>
    <text x="231.9" y="290" text-anchor="middle" font-size="9.5" fill="#5F7796">Mar</text>
    <text x="231.9" y="181" text-anchor="middle" font-size="9" fill="#9DB4CE" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.98s" fill="freeze"/>69</text>
    <rect x="259.3" y="110" width="42.8" height="160" rx="4" fill="#0E1830"/>
    <rect x="259.3" y="270" width="42.8" height="0" rx="4" fill="#2C6E9E"><animate attributeName="height" values="0;57" dur="0.8s" begin="1.54s" fill="freeze"/><animate attributeName="y" values="270;213" dur="0.8s" begin="1.54s" fill="freeze"/></rect>
    <text x="280.8" y="290" text-anchor="middle" font-size="9.5" fill="#5F7796">Apr</text>
    <text x="280.8" y="207" text-anchor="middle" font-size="9" fill="#9DB4CE" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.04s" fill="freeze"/>47</text>
    <rect x="308.2" y="110" width="42.8" height="160" rx="4" fill="#0E1830"/>
    <rect x="308.2" y="270" width="42.8" height="0" rx="4" fill="#2C6E9E"><animate attributeName="height" values="0;4" dur="0.8s" begin="1.60s" fill="freeze"/><animate attributeName="y" values="270;266" dur="0.8s" begin="1.60s" fill="freeze"/></rect>
    <text x="329.6" y="290" text-anchor="middle" font-size="9.5" fill="#5F7796">May</text>
    <rect x="357.0" y="110" width="42.8" height="160" rx="4" fill="#0E1830"/>
    <rect x="357.0" y="270" width="42.8" height="0" rx="4" fill="#2C6E9E"><animate attributeName="height" values="0;22" dur="0.8s" begin="1.66s" fill="freeze"/><animate attributeName="y" values="270;248" dur="0.8s" begin="1.66s" fill="freeze"/></rect>
    <text x="378.4" y="290" text-anchor="middle" font-size="9.5" fill="#5F7796">Jun</text>
    <text x="378.4" y="242" text-anchor="middle" font-size="9" fill="#9DB4CE" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.16s" fill="freeze"/>18</text>
    <rect x="405.8" y="110" width="42.8" height="160" rx="4" fill="#0E1830"/>
    <rect x="405.8" y="270" width="42.8" height="0" rx="4" fill="#2C6E9E"><animate attributeName="height" values="0;19" dur="0.8s" begin="1.72s" fill="freeze"/><animate attributeName="y" values="270;251" dur="0.8s" begin="1.72s" fill="freeze"/></rect>
    <text x="427.3" y="290" text-anchor="middle" font-size="9.5" fill="#5F7796">Jul</text>
    <text x="427.3" y="245" text-anchor="middle" font-size="9" fill="#9DB4CE" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.22s" fill="freeze"/>16</text>
    <rect x="454.7" y="110" width="42.8" height="160" rx="4" fill="#0E1830"/>
    <rect x="454.7" y="270" width="42.8" height="0" rx="4" fill="#2C6E9E"><animate attributeName="height" values="0;160" dur="0.8s" begin="1.78s" fill="freeze"/><animate attributeName="y" values="270;110" dur="0.8s" begin="1.78s" fill="freeze"/></rect>
    <text x="476.1" y="290" text-anchor="middle" font-size="9.5" fill="#5F7796">Aug</text>
    <text x="476.1" y="104" text-anchor="middle" font-size="9" fill="#9DB4CE" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.28s" fill="freeze"/>133</text>
    <rect x="503.5" y="110" width="42.8" height="160" rx="4" fill="#0E1830"/>
    <rect x="503.5" y="270" width="42.8" height="0" rx="4" fill="#2C6E9E"><animate attributeName="height" values="0;109" dur="0.8s" begin="1.84s" fill="freeze"/><animate attributeName="y" values="270;161" dur="0.8s" begin="1.84s" fill="freeze"/></rect>
    <text x="524.9" y="290" text-anchor="middle" font-size="9.5" fill="#5F7796">Sep</text>
    <text x="524.9" y="155" text-anchor="middle" font-size="9" fill="#9DB4CE" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.34s" fill="freeze"/>91</text>
    <rect x="552.3" y="110" width="42.8" height="160" rx="4" fill="#0E1830"/>
    <rect x="552.3" y="270" width="42.8" height="0" rx="4" fill="#2C6E9E"><animate attributeName="height" values="0;144" dur="0.8s" begin="1.90s" fill="freeze"/><animate attributeName="y" values="270;126" dur="0.8s" begin="1.90s" fill="freeze"/></rect>
    <text x="573.8" y="290" text-anchor="middle" font-size="9.5" fill="#5F7796">Oct</text>
    <text x="573.8" y="120" text-anchor="middle" font-size="9" fill="#9DB4CE" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.40s" fill="freeze"/>120</text>
    <rect x="601.2" y="110" width="42.8" height="160" rx="4" fill="#0E1830"/>
    <rect x="601.2" y="270" width="42.8" height="0" rx="4" fill="#4FC3F7"><animate attributeName="height" values="0;128" dur="0.8s" begin="1.96s" fill="freeze"/><animate attributeName="y" values="270;142" dur="0.8s" begin="1.96s" fill="freeze"/></rect>
    <text x="622.6" y="290" text-anchor="middle" font-size="9.5" fill="#5F7796">Nov</text>
    <text x="622.6" y="136" text-anchor="middle" font-size="9" fill="#9DB4CE" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.46s" fill="freeze"/>106</text>
  </g>

</g>

<rect x="1" y="1" width="998" height="318" rx="16" fill="none" stroke="url(#chart-edge)" stroke-width="1.4"/>

</svg>

