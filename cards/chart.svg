    <rect x="414.7" y="250" width="42.7" height="0" rx="4" fill="#2C6E9E"><animate attributeName="height" values="0;17" dur="0.8s" begin="1.15s" fill="freeze"/><animate attributeName="y" values="250;233" dur="0.8s" begin="1.15s" fill="freeze"/></rect>
    <text x="436.0" y="268" text-anchor="middle" font-size="9.5" fill="#5F7796">Jul</text>
    <text x="436.0" y="227" text-anchor="middle" font-size="9" fill="#9DB4CE">16</text>
    <rect x="465.3" y="110" width="42.7" height="140" rx="4" fill="#0E1830"/>
    <rect x="465.3" y="250" width="42.7" height="0" rx="4" fill="#4FC3F7"><animate attributeName="height" values="0;140" dur="0.8s" begin="1.20s" fill="freeze"/><animate attributeName="y" values="250;110" dur="0.8s" begin="1.20s" fill="freeze"/></rect>
    <text x="486.7" y="268" text-anchor="middle" font-size="9.5" fill="#5F7796">Aug</text>
    <text x="486.7" y="104" text-anchor="middle" font-size="9" fill="#A8E4FF">133</text>
    <rect x="516.0" y="110" width="42.7" height="140" rx="4" fill="#0E1830"/>
    <rect x="516.0" y="250" width="42.7" height="0" rx="4" fill="#2C6E9E"><animate attributeName="height" values="0;96" dur="0.8s" begin="1.25s" fill="freeze"/><animate attributeName="y" values="250;154" dur="0.8s" begin="1.25s" fill="freeze"/></rect>
    <text x="537.3" y="268" text-anchor="middle" font-size="9.5" fill="#5F7796">Sep</text>
    <text x="537.3" y="148" text-anchor="middle" font-size="9" fill="#9DB4CE">91</text>
    <rect x="566.7" y="110" width="42.7" height="140" rx="4" fill="#0E1830"/>
    <rect x="566.7" y="250" width="42.7" height="0" rx="4" fill="#2C6E9E"><animate attributeName="height" values="0;126" dur="0.8s" begin="1.30s" fill="freeze"/><animate attributeName="y" values="250;124" dur="0.8s" begin="1.30s" fill="freeze"/></rect>
    <text x="588.0" y="268" text-anchor="middle" font-size="9.5" fill="#5F7796">Oct</text>
    <text x="588.0" y="118" text-anchor="middle" font-size="9" fill="#9DB4CE">120</text>
    <rect x="617.3" y="110" width="42.7" height="140" rx="4" fill="#0E1830"/>
    <rect x="617.3" y="250" width="42.7" height="0" rx="4" fill="#2C9BCB"><animate attributeName="height" values="0;116" dur="0.8s" begin="1.35s" fill="freeze"/><animate attributeName="y" values="250;134" dur="0.8s" begin="1.35s" fill="freeze"/></rect>
    <text x="638.7" y="268" text-anchor="middle" font-size="9.5" fill="#5F7796">Nov</text>
    <text x="638.7" y="128" text-anchor="middle" font-size="9" fill="#9DB4CE">110</text>
