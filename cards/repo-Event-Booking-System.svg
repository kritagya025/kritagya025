<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" width="320" height="170" role="img" aria-label="Repository: Event-Booking-System">
<title>Repository: Event-Booking-System</title>
<style>
    #repo-1 .beam-rect {
      animation: beam-sweep-repo-1 9s 1.1s infinite linear;
    }
    @keyframes beam-sweep-repo-1 {
      from { transform: translateX(-220px); }
      to   { transform: translateX(320px); }
    }
    #repo-1 .fade-in {
      opacity: 0;
      animation: fadein-repo-1 0.8s 1.3s ease-out forwards;
    }
    @keyframes fadein-repo-1 {
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #repo-1 * {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      #repo-1 animate, #repo-1 animateTransform {
        fill: freeze;
        begin: 0s;
        dur: 0.001s;
        repeatCount: 1;
      }
    }
  </style>
<defs>
  <linearGradient id="repo-1-edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2C6E9E" stop-opacity="0.85"/>
    <stop offset="0.5" stop-color="#4FC3F7" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#2C6E9E" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="repo-1-beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A8E4FF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#A8E4FF" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#A8E4FF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="repo-1-halo" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#4FC3F7" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/>
  </radialGradient>
  <pattern id="repo-1-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#14213D" stroke-width="1"/>
  </pattern>
  <filter id="repo-1-glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="repo-1-clip"><rect x="1" y="1" width="318" height="168" rx="14"/></clipPath>
</defs>
<g id="repo-1" clip-path="url(#repo-1-clip)">
  <rect width="320" height="170" fill="#0A1128"/>
  <rect width="320" height="170" fill="url(#repo-1-grid)" opacity="0.45"/>
  <ellipse cx="140" cy="0" rx="360" ry="200" fill="url(#repo-1-halo)"/>
  <rect x="-220" y="0" width="220" height="170" fill="url(#repo-1-beam)">
    <animate attributeName="x" values="-220;320" dur="9s" begin="1.1s" repeatCount="indefinite"/>
  </rect>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">
  <g transform="translate(240,20) scale(0.7)" opacity="0.12">
    <path d="M20 2 L37 28 L15 33 Z" fill="#2C6E9E" opacity="0.75"/>
    <path d="M80 2 L63 28 L85 33 Z" fill="#2C6E9E" opacity="0.75"/>
    <path d="M15 29 L50 17 L85 29 L77 58 L50 97 L23 58 Z" fill="#0E1830" stroke="#1B3A6B" stroke-width="1.6"/>
    <path d="M50 17 L85 29 L77 58 L50 97 Z" fill="#05070D" opacity="0.4"/>
    <path d="M50 30 L54 52 L50 60 L46 52 Z" fill="#1B3A6B" opacity="0.9"/>
    <path d="M42 66 L50 78 L58 66 L50 71 Z" fill="#1B3A6B"/>
    <g filter="url(#repo-1-glow)">
      <path d="M29 45 L43 41 L44 47 L30 50 Z" fill="#4FC3F7"/>
      <path d="M71 45 L57 41 L56 47 L70 50 Z" fill="#4FC3F7"/>
    </g>
  </g>
    <circle cx="24" cy="28" r="4.5" fill="#b07219"/>    <text x="36" y="32" font-size="11" fill="#5F7796">Java</text>
    <text x="24" y="60" font-size="16" font-weight="700" fill="#4FC3F7">Event-Booking-System</text>
    <text x="24" y="86" font-size="11.5" fill="#9DB4CE">Comprehensive event management,</text>
    <text x="24" y="104" font-size="11.5" fill="#9DB4CE">seat allocation, and booking...</text>
    <line x1="20" y1="134" x2="300" y2="134" stroke="#14213D" stroke-width="1"/>    <text x="24" y="152" font-size="11" fill="#5F7796">★ 0  ·  ⑂ 0</text>    <text x="296" y="152" text-anchor="end" font-size="11" fill="#4FC3F7">view ↗</text>
  </g>
</g>
<rect x="1" y="1" width="318" height="168" rx="14" fill="none" stroke="url(#repo-1-edge)" stroke-width="1.4"/>
</svg>
