<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Kritagya Yadav — Java &amp; Spring Boot Developer">
<title>Kritagya Yadav — Java &amp; Spring Boot Developer</title>
<style>
    #hero .beam-rect {
      animation: beam-sweep-hero 9s 0.0s infinite linear;
    }
    @keyframes beam-sweep-hero {
      from { transform: translateX(-220px); }
      to   { transform: translateX(1000px); }
    }
    #hero .fade-in {
      opacity: 0;
      animation: fadein-hero 0.8s 0.2s ease-out forwards;
    }
    @keyframes fadein-hero {
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #hero * {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      #hero animate, #hero animateTransform {
        fill: freeze;
        begin: 0s;
        dur: 0.001s;
        repeatCount: 1;
      }
    }
  </style>
<defs>
  <linearGradient id="hero-edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2C6E9E" stop-opacity="0.85"/>
    <stop offset="0.5" stop-color="#4FC3F7" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#2C6E9E" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="hero-beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A8E4FF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#A8E4FF" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#A8E4FF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="hero-halo" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#4FC3F7" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/>
  </radialGradient>
  <pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#14213D" stroke-width="1"/>
  </pattern>
  <filter id="hero-glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="hero-clip"><rect x="1" y="1" width="998" height="358" rx="14"/></clipPath>
</defs>
<g id="hero" clip-path="url(#hero-clip)">
  <rect width="1000" height="360" fill="#0A1128"/>
  <rect width="1000" height="360" fill="url(#hero-grid)" opacity="0.45"/>
  <ellipse cx="140" cy="0" rx="360" ry="200" fill="url(#hero-halo)"/>
  <rect x="-220" y="0" width="220" height="360" fill="url(#hero-beam)">
    <animate attributeName="x" values="-220;1000" dur="9s" begin="0.0s" repeatCount="indefinite"/>
  </rect>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" class="fade-in">
  <g transform="translate(770,55) scale(1.75)" opacity="0.95">
    <path d="M20 2 L37 28 L15 33 Z" fill="#2C6E9E" opacity="0.75"/>
    <path d="M80 2 L63 28 L85 33 Z" fill="#2C6E9E" opacity="0.75"/>
    <path d="M15 29 L50 17 L85 29 L77 58 L50 97 L23 58 Z" fill="#0E1830" stroke="#1B3A6B" stroke-width="1.6"/>
    <path d="M50 17 L85 29 L77 58 L50 97 Z" fill="#05070D" opacity="0.4"/>
    <path d="M50 30 L54 52 L50 60 L46 52 Z" fill="#1B3A6B" opacity="0.9"/>
    <path d="M42 66 L50 78 L58 66 L50 71 Z" fill="#1B3A6B"/>
    <g filter="url(#hero-glow)">
      <path d="M29 45 L43 41 L44 47 L30 50 Z" fill="#4FC3F7"/>
      <path d="M71 45 L57 41 L56 47 L70 50 Z" fill="#4FC3F7"/>
    </g>
  </g>
    <rect x="60" y="48" width="34" height="2" fill="#4FC3F7"/>
    <text x="60" y="76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" letter-spacing="3.2" fill="#9DB4CE">SYSTEM ONLINE // PROFILE 025</text>
    <text x="60" y="136" font-size="50" font-weight="800" fill="#E8F1FA" letter-spacing="1.2">KRITAGYA YADAV</text>
    <text x="60" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" font-weight="600" fill="#4FC3F7" letter-spacing="0.6">Java  ·  Spring Boot  ·  Backend Engineering</text>
    <text x="60" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#9DB4CE">Architecting resilient backend systems, distributed services &amp; DevOps tooling</text>
    <g><rect x="60.0" y="234" width="45.2" height="26" rx="6" fill="#0E1830" stroke="#1B3A6B" stroke-width="1"/><text x="67.0" y="251" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1.2" fill="#A8E4FF">JAVA</text></g>
    <g><rect x="114.2" y="234" width="99.8" height="26" rx="6" fill="#0E1830" stroke="#1B3A6B" stroke-width="1"/><text x="121.2" y="251" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1.2" fill="#A8E4FF">SPRING BOOT</text></g>
    <g><rect x="223.0" y="234" width="60.8" height="26" rx="6" fill="#0E1830" stroke="#1B3A6B" stroke-width="1"/><text x="230.0" y="251" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1.2" fill="#A8E4FF">DOCKER</text></g>
    <g><rect x="292.8" y="234" width="53.0" height="26" rx="6" fill="#0E1830" stroke="#1B3A6B" stroke-width="1"/><text x="299.8" y="251" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1.2" fill="#A8E4FF">CI/CD</text></g>
    <g><rect x="354.8" y="234" width="53.0" height="26" rx="6" fill="#0E1830" stroke="#1B3A6B" stroke-width="1"/><text x="361.8" y="251" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1.2" fill="#A8E4FF">LINUX</text></g>
    <g><rect x="416.8" y="234" width="37.4" height="26" rx="6" fill="#0E1830" stroke="#1B3A6B" stroke-width="1"/><text x="423.8" y="251" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1.2" fill="#A8E4FF">AWS</text></g>
    <g><rect x="463.2" y="234" width="53.0" height="26" rx="6" fill="#0E1830" stroke="#1B3A6B" stroke-width="1"/><text x="470.2" y="251" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1.2" fill="#A8E4FF">AZURE</text></g>
    <g><rect x="525.2" y="234" width="115.4" height="26" rx="6" fill="#0E1830" stroke="#1B3A6B" stroke-width="1"/><text x="532.2" y="251" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1.2" fill="#A8E4FF">SYSTEM DESIGN</text></g>
    <text x="60" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" letter-spacing="2.8" fill="#9DB4CE">QUIET IN APPROACH.  PRECISE IN EXECUTION.<animate attributeName="opacity" values="0.72;1;0.72" dur="4.5s" repeatCount="indefinite"/></text>
  </g>
</g>
<rect x="1" y="1" width="998" height="358" rx="14" fill="none" stroke="url(#hero-edge)" stroke-width="1.4"/>
</svg>
