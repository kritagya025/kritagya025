<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 110" width="1000" height="110" role="img" aria-label="Social links: LinkedIn, GitHub, Email">

<title>Social links: LinkedIn, GitHub, Email</title>

<style>

    #links .beam-rect {

      animation: beam-sweep-links 9s 0.5s infinite linear;

    }

    @keyframes beam-sweep-links {

      from { transform: translateX(-220px); }

      to   { transform: translateX(1000px); }

    }

    #links .fade-in {

      opacity: 0;

      animation: fadein-links 0.8s 0.7s ease-out forwards;

    }

    @keyframes fadein-links {

      to { opacity: 1; }

    }

    #links .slide-up {

      opacity: 0;

      transform: translateY(12px);

      animation: slideup-links 0.6s ease-out forwards;

    }

    @keyframes slideup-links {

      to { opacity: 1; transform: translateY(0); }

    }

    

    @keyframes slideup-links {

      from { opacity: 0; transform: translateY(12px); }

      to   { opacity: 1; transform: translateY(0); }

    }

    

    @media (prefers-reduced-motion: reduce) {

      #links * {

        animation-play-state: paused !important;

        animation-delay: -1s !important;

        animation-duration: 0s !important;

        animation-iteration-count: 1 !important;

      }

      #links animate,

      #links animateTransform {

        fill: freeze;

        begin: 0s;

        dur: 0.001s;

        repeatCount: 1;

      }

    }

  </style>

<defs>

  <linearGradient id="links-edge" x1="0" y1="0" x2="1" y2="1">

    <stop offset="0" stop-color="#2C6E9E" stop-opacity="0.85"/>

    <stop offset="0.5" stop-color="#4FC3F7" stop-opacity="0.85"/>

    <stop offset="1" stop-color="#2C6E9E" stop-opacity="0.85"/>

  </linearGradient>

  <linearGradient id="links-beam" x1="0" y1="0" x2="1" y2="0">

    <stop offset="0" stop-color="#A8E4FF" stop-opacity="0"/>

    <stop offset="0.5" stop-color="#A8E4FF" stop-opacity="0.13"/>

    <stop offset="1" stop-color="#A8E4FF" stop-opacity="0"/>

  </linearGradient>

  <radialGradient id="links-halo" cx="50%" cy="50%" r="50%">

    <stop offset="0" stop-color="#4FC3F7" stop-opacity="0.18"/>

    <stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/>

  </radialGradient>

  <pattern id="links-grid" width="40" height="40" patternUnits="userSpaceOnUse">

    <path d="M40 0H0V40" fill="none" stroke="#14213D" stroke-width="1"/>

  </pattern>

  <filter id="links-glow" x="-60%" y="-60%" width="220%" height="220%">

    <feGaussianBlur stdDeviation="2.2" result="b"/>

    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>

  </filter>

  <clipPath id="links-clip"><rect x="1" y="1" width="998" height="108" rx="16"/></clipPath>

</defs>

<g id="links" clip-path="url(#links-clip)">

  <rect width="1000" height="110" fill="#0A1128"/>

  <rect width="1000" height="110" fill="url(#links-grid)" opacity="0.5"/>

  <ellipse cx="150" cy="0" rx="380" ry="210" fill="url(#links-halo)"/>

  <rect x="-220" y="0" width="220" height="110" fill="url(#links-beam)">

    <animate attributeName="x" values="-220;1000" dur="9s" begin="0.5s" repeatCount="indefinite"/>

  </rect>

  <g style="opacity:0;animation:slideup-links 0.6s 0.50s ease-out forwards;">

    <a href="https://www.linkedin.com/in/kritagya-yadav/" target="_blank">

      <rect x="0" y="10" width="320" height="90" rx="12"

            fill="#0E1830" stroke="#14213D" stroke-width="1"/>

      <g transform="translate(20,32) scale(0.9)">

        <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z" fill="#0a66c2"/>

      </g>

      <text x="56" y="48" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15"

            font-weight="700" fill="#E8F1FA">LinkedIn</text>

      <text x="56" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11"

            fill="#5F7796">Connect on LinkedIn</text>

    </a>

  </g>
  <g style="opacity:0;animation:slideup-links 0.6s 0.65s ease-out forwards;">

    <a href="https://github.com/kritagya025" target="_blank">

      <rect x="340" y="10" width="320" height="90" rx="12"

            fill="#0E1830" stroke="#14213D" stroke-width="1"/>

      <g transform="translate(360,32) scale(0.9)">

        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2z" fill="#181717"/>

      </g>

      <text x="396" y="48" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15"

            font-weight="700" fill="#E8F1FA">GitHub</text>

      <text x="396" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11"

            fill="#5F7796">Follow on GitHub</text>

    </a>

  </g>
  <g style="opacity:0;animation:slideup-links 0.6s 0.80s ease-out forwards;">

    <a href="mailto:kritagyay2006@gmail.com" target="_blank">

      <rect x="680" y="10" width="320" height="90" rx="12"

            fill="#0E1830" stroke="#14213D" stroke-width="1"/>

      <g transform="translate(700,32) scale(0.9)">

        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z" fill="#ea4335"/>

      </g>

      <text x="736" y="48" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15"

            font-weight="700" fill="#E8F1FA">Email</text>

      <text x="736" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11"

            fill="#5F7796">Contact via Email</text>

    </a>

  </g>

</g>

<rect x="1" y="1" width="998" height="108" rx="16" fill="none" stroke="url(#links-edge)" stroke-width="1.4"/>

</svg>

