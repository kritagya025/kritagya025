<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="System profile: whoami, certifications and tech stack">
<title>System profile: whoami, certifications and tech stack</title>
<style>
    #profile .beam-rect {
      animation: beam-sweep-profile 9s 0.4s infinite linear;
    }
    @keyframes beam-sweep-profile {
      from { transform: translateX(-220px); }
      to   { transform: translateX(1000px); }
    }
    #profile .fade-in {
      opacity: 0;
      animation: fadein-profile 0.8s 0.6s ease-out forwards;
    }
    @keyframes fadein-profile {
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #profile * {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      #profile animate, #profile animateTransform {
        fill: freeze;
        begin: 0s;
        dur: 0.001s;
        repeatCount: 1;
      }
    }
  </style>
<defs>
  <linearGradient id="profile-edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2C6E9E" stop-opacity="0.85"/>
    <stop offset="0.5" stop-color="#4FC3F7" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#2C6E9E" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="profile-beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A8E4FF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#A8E4FF" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#A8E4FF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="profile-halo" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#4FC3F7" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/>
  </radialGradient>
  <pattern id="profile-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#14213D" stroke-width="1"/>
  </pattern>
  <filter id="profile-glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="profile-clip"><rect x="1" y="1" width="998" height="478" rx="14"/></clipPath>
</defs>
