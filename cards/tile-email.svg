<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100" role="img" aria-label="EMAIL: kritagyay2006@gmail.com">
<title>EMAIL: kritagyay2006@gmail.com</title>
<style>
    #tile-email .beam-rect {
      animation: beam-sweep-tile-email 9s 0.5s infinite linear;
    }
    @keyframes beam-sweep-tile-email {
      from { transform: translateX(-220px); }
      to   { transform: translateX(320px); }
    }
    #tile-email .fade-in {
      opacity: 0;
      animation: fadein-tile-email 0.8s 0.7s ease-out forwards;
    }
    @keyframes fadein-tile-email {
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #tile-email * {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      #tile-email animate, #tile-email animateTransform {
        fill: freeze;
        begin: 0s;
        dur: 0.001s;
        repeatCount: 1;
      }
    }
  </style>
<defs>
  <linearGradient id="tile-email-edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2C6E9E" stop-opacity="0.85"/>
    <stop offset="0.5" stop-color="#4FC3F7" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#2C6E9E" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="tile-email-beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A8E4FF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#A8E4FF" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#A8E4FF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="tile-email-halo" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#4FC3F7" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/>
  </radialGradient>
  <pattern id="tile-email-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#14213D" stroke-width="1"/>
  </pattern>
  <filter id="tile-email-glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="tile-email-clip"><rect x="1" y="1" width="318" height="98" rx="14"/></clipPath>
</defs>
<g id="tile-email" clip-path="url(#tile-email-clip)">
  <rect width="320" height="100" fill="#0A1128"/>
  <rect width="320" height="100" fill="url(#tile-email-grid)" opacity="0.45"/>
  <ellipse cx="140" cy="0" rx="360" ry="200" fill="url(#tile-email-halo)"/>
  <rect x="-220" y="0" width="220" height="100" fill="url(#tile-email-beam)">
    <animate attributeName="x" values="-220;320" dur="9s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">

    <g transform="translate(24, 28) scale(1.1)">
      <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z" fill="#EA4335"/>
    </g>
    <text x="70" y="44" font-size="16" font-weight="700" fill="#E8F1FA">EMAIL</text>
    <text x="70" y="66" font-size="11" fill="#5F7796">kritagyay2006@gmail.com</text>
    <rect x="236" y="34" width="62" height="24" rx="12" fill="#0E1830" stroke="#1B3A6B" stroke-width="1"/>
    <text x="267" y="50" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4FC3F7">Contact</text>
    
  </g>
</g>
<rect x="1" y="1" width="318" height="98" rx="14" fill="none" stroke="url(#tile-email-edge)" stroke-width="1.4"/>
</svg>
