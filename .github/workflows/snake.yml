name: Generate contribution snake

on:
  schedule:
    # Twice a day is plenty; the snake only changes as the calendar does.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# Never let a scheduled run and a manual one publish to `output` at once.
concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Needed to publish the generated SVGs to the `output` branch.
      contents: write
    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: kritagya025
          # Dot colours are the same five-step ramp the contribution trail
          # card uses, so the snake reads as part of the same system.
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
