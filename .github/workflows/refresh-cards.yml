name: Refresh profile cards

on:
  schedule:
    # Daily at 06:20 UTC — contribution data changes at most once a day,
    # and GitHub caches the calendar for a few hours anyway.
    - cron: "20 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_cards.py"
      - ".github/workflows/refresh-cards.yml"

# Never let concurrent runs race to commit.
concurrency:
  group: refresh-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 1. Fetch contribution data from GitHub ──────────────────
      #    Writes data/contributions.json so the render step never
      #    hits the network.  REFRESH=1 forces a re-fetch even when
      #    the file already exists.
      - name: Refresh contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: kritagya025
          REFRESH: "1"
        run: python scripts/build_cards.py

      # ── 2. Render animated SVG cards into cards/ ────────────────
      #    Uses the JSON written above.  No network calls.
      - name: Render cards (animated)
        env:
          GITHUB_USERNAME: kritagya025
        run: python scripts/build_cards.py

      # ── 3. Commit and push if anything changed ─────────────────
      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/ data/ README.md
          git diff --staged --quiet || git commit -m "chore: refresh profile cards [skip ci]"
          git push
