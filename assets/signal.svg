<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="GitHub statistics and most used languages">
<title>GitHub statistics and most used languages</title>
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2C6E9E" stop-opacity="0.85"/>
    <stop offset="0.5" stop-color="#4FC3F7" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#2C6E9E" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A8E4FF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#A8E4FF" stop-opacity="0.13"/>
    <stop offset="1" stop-color="#A8E4FF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#4FC3F7" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#14213D" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="clip"><rect x="1" y="1" width="998" height="328" rx="16"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1000" height="330" fill="#0A1128"/>
  <rect width="1000" height="330" fill="url(#grid)" opacity="0.5"/>
  <ellipse cx="150" cy="0" rx="380" ry="210" fill="url(#halo)"/>
  <rect x="-220" y="0" width="220" height="330" fill="url(#beam)">
    <animate attributeName="x" values="-220;1000" dur="9s" repeatCount="indefinite"/>
  </rect>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">
    <rect x="64" y="44" width="34" height="2" fill="#4FC3F7"/>
    <text x="64" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" letter-spacing="3.2" fill="#9DB4CE">GITHUB SIGNAL</text>
    <text x="64" y="96" font-size="11.5" fill="#5F7796">live data · regenerated daily from the GitHub API</text>
    <g><rect x="64" y="130" width="140" height="66" rx="9" fill="#0E1830" stroke="#14213D" stroke-width="1"/><text x="80" y="164" font-size="27" font-weight="700" fill="#4FC3F7">324</text><text x="80" y="183" font-size="10" letter-spacing="0.6" fill="#5F7796">contributions / year</text></g>
    <g><rect x="220" y="130" width="140" height="66" rx="9" fill="#0E1830" stroke="#14213D" stroke-width="1"/><text x="236" y="164" font-size="27" font-weight="700" fill="#4FC3F7">27</text><text x="236" y="183" font-size="10" letter-spacing="0.6" fill="#5F7796">public repositories</text></g>
    <g><rect x="376" y="130" width="140" height="66" rx="9" fill="#0E1830" stroke="#14213D" stroke-width="1"/><text x="392" y="164" font-size="27" font-weight="700" fill="#4FC3F7">5</text><text x="392" y="183" font-size="10" letter-spacing="0.6" fill="#5F7796">stars earned</text></g>
    <g><rect x="64" y="214" width="140" height="66" rx="9" fill="#0E1830" stroke="#14213D" stroke-width="1"/><text x="80" y="248" font-size="27" font-weight="700" fill="#4FC3F7">2</text><text x="80" y="267" font-size="10" letter-spacing="0.6" fill="#5F7796">followers</text></g>
    <g><rect x="220" y="214" width="140" height="66" rx="9" fill="#0E1830" stroke="#14213D" stroke-width="1"/><text x="236" y="248" font-size="27" font-weight="700" fill="#4FC3F7">3</text><text x="236" y="267" font-size="10" letter-spacing="0.6" fill="#5F7796">current streak</text></g>
    <g><rect x="376" y="214" width="140" height="66" rx="9" fill="#0E1830" stroke="#14213D" stroke-width="1"/><text x="392" y="248" font-size="27" font-weight="700" fill="#4FC3F7">9</text><text x="392" y="267" font-size="10" letter-spacing="0.6" fill="#5F7796">longest streak</text></g>
    <line x1="562" y1="118" x2="562" y2="296" stroke="#14213D" stroke-width="1"/>
    <text x="600" y="138" font-size="12" letter-spacing="2.6" fill="#9DB4CE">MOST USED LANGUAGES</text>
    <text x="600" y="158" font-size="10.5" fill="#5F7796">by bytes across 24 public repos</text>
    <text x="600" y="194" font-size="12" fill="#9DB4CE">Jupyter Notebook</text>
    <rect x="740" y="186" width="196" height="8" rx="4" fill="#14213D"/>
    <rect x="740" y="186" width="89" height="8" rx="4" fill="#4FC3F7"><animate attributeName="width" values="0;89" dur="1.1s" begin="0.50s" fill="freeze"/></rect>
    <text x="946" y="194" font-size="10.5" fill="#5F7796">45.4%</text>
    <text x="600" y="220" font-size="12" fill="#9DB4CE">Java</text>
    <rect x="740" y="212" width="196" height="8" rx="4" fill="#14213D"/>
    <rect x="740" y="212" width="34" height="8" rx="4" fill="#2C6E9E"><animate attributeName="width" values="0;34" dur="1.1s" begin="0.62s" fill="freeze"/></rect>
    <text x="946" y="220" font-size="10.5" fill="#5F7796">17.5%</text>
    <text x="600" y="246" font-size="12" fill="#9DB4CE">JavaScript</text>
    <rect x="740" y="238" width="196" height="8" rx="4" fill="#14213D"/>
    <rect x="740" y="238" width="30" height="8" rx="4" fill="#2C6E9E"><animate attributeName="width" values="0;30" dur="1.1s" begin="0.74s" fill="freeze"/></rect>
    <text x="946" y="246" font-size="10.5" fill="#5F7796">15.3%</text>
    <text x="600" y="272" font-size="12" fill="#9DB4CE">HTML</text>
    <rect x="740" y="264" width="196" height="8" rx="4" fill="#14213D"/>
    <rect x="740" y="264" width="24" height="8" rx="4" fill="#2C6E9E"><animate attributeName="width" values="0;24" dur="1.1s" begin="0.86s" fill="freeze"/></rect>
    <text x="946" y="272" font-size="10.5" fill="#5F7796">12.3%</text>
    <text x="600" y="298" font-size="12" fill="#9DB4CE">CSS</text>
    <rect x="740" y="290" width="196" height="8" rx="4" fill="#14213D"/>
    <rect x="740" y="290" width="15" height="8" rx="4" fill="#2C6E9E"><animate attributeName="width" values="0;15" dur="1.1s" begin="0.98s" fill="freeze"/></rect>
    <text x="946" y="298" font-size="10.5" fill="#5F7796">7.8%</text>
  </g>
</g>
<rect x="1" y="1" width="998" height="328" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.4"/>
</svg>
